<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دوسياتي</title>
<meta name="theme-color" content="#00205B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--z:1;--navy:#00205B;--blue:#2B5CA8;--mint:#EAF4F1;--gold:#FFF6E0;--line:#DCE3EC;--ink:#12243B;--bg:#F5F7FA}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--z))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Tahoma","Traditional Arabic",system-ui,sans-serif;line-height:1.85}
#bar{position:sticky;top:0;z-index:20;display:flex;gap:.5rem;align-items:center;background:var(--navy);color:#fff;padding:.5rem .9rem}
#bar .brand{font-weight:700;margin-inline-end:auto;font-size:1.05rem}
#bar button{background:#ffffff22;color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:.35rem .6rem;font-size:.85rem;cursor:pointer}
.wrap{max-width:52rem;margin:0 auto;padding:1rem .9rem 4rem}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:16px;padding:1.4rem 1.2rem;margin-bottom:1rem}
.hero h1{margin:0 0 .2rem;font-size:1.7rem}.hero p{margin:0;opacity:.9;font-size:.95rem}
.search{width:100%;padding:.7rem .9rem;border:1px solid var(--line);border-radius:12px;font-size:1rem;background:#fff;margin-bottom:1rem}
.grade{font-size:1.05rem;color:var(--navy);margin:1.2rem 0 .5rem;border-inline-start:5px solid var(--blue);padding-inline-start:.6rem}
.row{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.9rem;text-decoration:none;color:inherit;box-shadow:0 1px 2px #0000000d}
.card:hover{border-color:var(--blue);transform:translateY(-1px)}
.card .sub{display:inline-block;background:var(--mint);color:var(--navy);border-radius:999px;padding:.1rem .6rem;font-size:.75rem;margin-bottom:.4rem}
.card strong{display:block;font-size:1.05rem;color:var(--navy)}
.card .meta{display:block;font-size:.8rem;color:#5b6b80;margin-top:.3rem}
.uhead{display:flex;gap:.8rem;align-items:center;margin-bottom:.6rem}
.uhead .back{color:var(--blue);text-decoration:none;font-size:.9rem}
.uhead strong{display:block;color:var(--navy);font-size:1.2rem}
.uhead span{font-size:.82rem;color:#5b6b80}
.tabs{display:flex;gap:.35rem;overflow:auto;padding-bottom:.4rem;position:sticky;top:2.9rem;background:var(--bg);z-index:10}
.tab{white-space:nowrap;padding:.4rem .8rem;border-radius:999px;background:#fff;border:1px solid var(--line);color:#40506a;text-decoration:none;font-size:.9rem}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabbody{margin-top:.8rem}
.box.warn2{background:#FCEAE8;border-color:#efc4c0}
.tw.codes td.act{white-space:nowrap}
.mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.15rem .5rem;font:inherit;font-size:.78rem;color:var(--navy);cursor:pointer;margin:0 .15rem}
.mini:hover{border-color:var(--blue)}
.mini.danger{color:#B3261E;border-color:#efc4c0}
.tw.codes tr.gone{opacity:.55}
.tw.codes tr.gone td:nth-child(2){text-decoration:line-through}
.err.wait{color:#2B5CA8}
.tw.codes td:nth-child(4){direction:ltr;font-family:Consolas,monospace;letter-spacing:.06em}
h1.ch{background:var(--navy);color:#fff;font-size:1.1rem;padding:.55rem .8rem;border-radius:10px;margin:1.6rem 0 .8rem}
h2{color:var(--navy);font-size:1.05rem;margin:1.2rem 0 .4rem;border-bottom:2px solid var(--mint);padding-bottom:.2rem}
h2.lvl{background:var(--mint);border:0;border-radius:8px;padding:.4rem .7rem}
h3{color:var(--blue);font-size:.98rem;margin:.9rem 0 .3rem}
p{margin:.5rem 0;text-align:justify}
.li{margin:.35rem 0;padding-inline-start:1.1rem;position:relative}
.li::before{content:"•";position:absolute;inset-inline-start:.2rem;color:var(--blue)}
.eq{background:#fff;border:1px dashed #9AA7B8;border-radius:8px;padding:.5rem .7rem;margin:.5rem 0;text-align:center;font-family:"Times New Roman",serif;font-size:1.05rem;color:var(--navy);overflow-x:auto}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:"Times New Roman",serif}
.tw{overflow-x:auto;margin:.7rem 0}
table{border-collapse:collapse;width:100%;background:#fff;font-size:.92rem}
th,td{border:1px solid var(--line);padding:.45rem .55rem;text-align:start;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600}
tr:nth-child(even) td{background:#FAFCFE}
.box{border-radius:12px;padding:.8rem .9rem;margin:.9rem 0;border:1px solid var(--line)}
.box.mint{background:var(--mint);border-color:#BFD8D2}
.box.gold{background:var(--gold);border-color:#EBD9A8}
.box .bt{font-weight:700;color:var(--navy);margin-bottom:.3rem}
.card2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.9rem;margin:.8rem 0}
.card2 .ct{font-weight:700;color:#7A2E2E;margin-bottom:.3rem}
.card2 .qn{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:0 .5rem;font-size:.8rem;margin-bottom:.3rem}
.qq{font-weight:600;color:#1b2f4d}
.m{color:#B03030;font-size:.85rem;font-style:normal}
.btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:.45rem .9rem;font-size:.9rem;cursor:pointer;margin:.3rem .3rem .3rem 0}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap}
.sol .eq,.ans .eq{background:#F7FBFF}
.ans{border-top:1px dashed var(--line);margin-top:.5rem;padding-top:.4rem}
.hidden{display:none}
.hint{color:#5b6b80;font-size:.9rem}
.opts{display:grid;gap:.4rem;margin:.4rem 0}
.opt{text-align:start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.45rem .7rem;font-size:.95rem;cursor:pointer;font-family:inherit}
.opt span{display:inline-block;min-width:1.6rem;color:var(--blue);font-weight:700}
.opt.right{background:#E8F7EE;border-color:#48A96B}
.opt.wrong{background:#FDECEC;border-color:#D06060}
.fb{margin-top:.4rem;font-size:.9rem;padding:.4rem .6rem;border-radius:8px}
.fb.g{background:#E8F7EE;color:#1E6B3B}.fb.r{background:#FDECEC;color:#8B2C2C}
.fb .note{color:#40506a;margin-top:.25rem;font-size:.86rem}
.thead{display:flex;gap:.6rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;flex-wrap:wrap}
.thead strong{color:var(--navy)}.thead span{font-size:.85rem;color:#5b6b80;margin-inline-end:auto}
.timer{font-family:"Times New Roman",serif;font-size:1.2rem;color:#B03030;min-width:4.5rem;text-align:center}
.score{background:var(--mint);border-radius:10px;padding:.6rem .8rem;margin:.8rem 0;font-size:.95rem}
textarea{width:100%;min-height:4.5rem;border:1px solid var(--line);border-radius:10px;padding:.5rem;font-family:inherit;font-size:.95rem;margin:.4rem 0}
.gate{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem;text-align:center}
.gate input{padding:.5rem .8rem;border:1px solid var(--line);border-radius:9px;font-size:1rem;margin:.4rem}
.gate.big{padding:1.6rem 1.2rem;max-width:30rem;margin:1rem auto}
.gate.big input{font-size:1.25rem;letter-spacing:.12em;text-align:center;width:14rem}
.gate .lock{font-size:2rem;margin-bottom:.3rem}
.err{color:#B03030;font-size:.9rem;min-height:1.2em;margin:.3rem 0}
.frow{display:flex;flex-wrap:wrap;gap:.6rem;margin:.6rem 0}
.fl{display:flex;flex-direction:column;font-size:.82rem;color:#40506a;gap:.15rem}
.fl select,.fl input{padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;font-size:.95rem;font-family:inherit;background:#fff}
.num{width:6rem}
.codes table{font-size:.9rem}.codes td:nth-child(2){font-family:"Times New Roman",serif;direction:ltr;text-align:center;font-size:1.05rem;letter-spacing:.06em}
.tkbig{background:var(--navy);color:#fff;border-radius:12px;padding:.6rem;text-align:center;font-family:"Times New Roman",serif;font-size:2rem;letter-spacing:.25em;margin:.6rem 0}
.thead.run{position:sticky;top:5.6rem;z-index:9;border-color:#D06060}
.thead.done{background:#E8F7EE;border-color:#48A96B}
.timer.warn{animation:bl 1s steps(2,start) infinite}
@keyframes bl{50%{opacity:.35}}
.btn.danger{background:#B03030}
.opt.sel{background:#E7EEFA;border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt.res{cursor:default}
.mine{background:#F7F9FC;border:1px dashed var(--line);border-radius:10px;padding:.5rem .7rem;margin:.5rem 0;font-size:.95rem;white-space:normal}
.mt{font-weight:700;color:var(--navy);font-size:.85rem;margin-bottom:.2rem}
.mark{min-width:5rem}
.score.big{font-size:1.02rem;border:1px solid #BFD8D2}
#bar #who{font-size:.8rem;opacity:.85;margin-inline-end:.4rem}
.wide{min-width:16rem}
.chk{display:flex;align-items:center;gap:.5rem;margin:.35rem 0;font-size:.95rem;cursor:pointer}
.chk input{width:1.05rem;height:1.05rem;accent-color:var(--blue)}
.chk .sm,.sm{font-size:.82rem;color:#5b6b80;font-style:normal}
.btn.sm{font-size:.8rem;padding:.25rem .6rem}
.savebar{position:sticky;bottom:0;display:flex;gap:.5rem;background:#fffffff2;border-top:1px solid var(--line);padding:.5rem;margin-top:1rem;border-radius:12px 12px 0 0;backdrop-filter:blur(4px);z-index:11}
table.perm td.c{text-align:center;vertical-align:middle}
table.perm td.c input{width:1.1rem;height:1.1rem;accent-color:var(--blue)}
table.perm th{font-size:.82rem}
.card.off{opacity:.55;border-style:dashed}
.card .tag{display:inline-block;background:#FDECEC;color:#8B2C2C;border-radius:6px;padding:0 .4rem;font-size:.72rem;margin-top:.35rem}
.tab.dim{opacity:.5;text-decoration:line-through}
.json{background:#0f1a2b;color:#cfe3ff;padding:.7rem;border-radius:10px;overflow:auto;max-height:18rem;font-size:.75rem;direction:ltr;text-align:left}
#flash{position:fixed;inset-inline:0;bottom:1.2rem;margin:auto;width:max-content;max-width:90%;background:var(--navy);color:#fff;padding:.5rem 1rem;border-radius:999px;font-size:.9rem;opacity:0;transform:translateY(.6rem);transition:.2s;pointer-events:none;z-index:50}
#flash.on{opacity:1;transform:none}
.sep{display:flex;align-items:center;gap:.6rem;color:#8494a8;font-size:.82rem;margin:1rem 0 .4rem}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.dark{background:var(--navy)}
.cards{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));margin:.7rem 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem}
.stat b{display:block;font-size:1.45rem;color:var(--navy);line-height:1.3}
.stat span{font-size:.8rem;color:#5b6b80}
.stat.g b{color:#1E6B3B}.stat.r b{color:#8B2C2C}
.pill{display:inline-block;border-radius:999px;padding:.05rem .55rem;font-size:.78rem}
.pill.in{background:#E8F7EE;color:#1E6B3B}.pill.out{background:#FDECEC;color:#8B2C2C}
table.follow th{font-size:.78rem}
table.follow td{white-space:nowrap}
.tw.codes td:nth-child(4){font-family:"Times New Roman",serif;direction:ltr;text-align:center;letter-spacing:.06em}
.radar{background:#fff;border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
#modal{position:fixed;inset:0;background:#0b1a2e99;display:none;align-items:flex-start;justify-content:center;z-index:60;padding:1.2rem;overflow:auto}
#modal.on{display:flex}
.mcard{background:var(--bg);border-radius:16px;padding:1rem;max-width:26rem;width:100%}
.mcard h3{margin:.1rem 0 .4rem;color:var(--navy);font-size:1.05rem}
@media print{#modal{position:static;background:none;display:block}#modal:not(.on){display:none}.mcard{max-width:none}}
.draw{border:1px dashed #9AA7B8;border-radius:8px;padding:1.2rem;text-align:center;color:#8494a8;font-size:.85rem;margin:.5rem 0}
.foot{margin-top:2.5rem;text-align:center;color:#8494a8;font-size:.8rem}
.empty{text-align:center;color:#8494a8;padding:2rem}
body.present{--z:1.55}
body.present .tabs{top:0}
body.present #bar .brand,body.present .uhead .back{display:none}
body.present .wrap{max-width:70rem}
body.present .card2,body.present .box,body.present table{font-size:1.02em}

/* ===== الترويسة الرسمية ===== */
.ohead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:.9rem;text-align:center;margin-bottom:.9rem}
.ohead .olog{width:74px;height:74px;object-fit:contain;margin-bottom:.3rem}
.ohead .d1{font-size:.9rem;color:#40506a}
.ohead .d2{font-size:1rem;font-weight:700;color:var(--navy)}
.ohead .d3{font-size:1.45rem;font-weight:700;color:var(--blue);margin:.3rem 0 .05rem}
.ohead .d4{font-size:.84rem;color:#5b6b80}
/* ===== مسار المحطّات ===== */
.uhead2{display:flex;align-items:center;gap:.6rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.7rem .85rem}
.uhead2 strong{display:block;color:var(--navy);font-size:1.15rem}
.uhead2 span{font-size:.8rem;color:#5b6b80}
.uhead2 .back{display:inline-block;color:var(--blue);text-decoration:none;font-size:.85rem;margin-bottom:.15rem}
.ring{flex:0 0 auto}
.steps{display:flex;gap:.3rem;overflow:auto;padding:.5rem 0;position:sticky;top:2.6rem;background:var(--bg);z-index:10}
.st{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#5b6b80;border-radius:999px;padding:.3rem .7rem;font-size:.84rem;cursor:pointer;font-family:inherit;display:flex;gap:.35rem;align-items:center}
.st b{background:#EDF1F7;color:#40506a;border-radius:50%;width:1.3rem;height:1.3rem;display:grid;place-items:center;font-size:.72rem}
.st.on{background:var(--navy);color:#fff;border-color:var(--navy)}.st.on b{background:#ffffff33;color:#fff}
.st.done{border-color:#9AD0B0}.st.done b{background:#E8F7EE;color:#1E6B3B}
.st.lock{opacity:.5}
.btn.ok{background:#1E6B3B}
.card .crow{display:flex;gap:.6rem;align-items:center}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.5rem;margin:.6rem 0;text-align:center}
.fig img{max-width:100%;border-radius:8px}
.fig .cap{font-size:.8rem;color:#5b6b80;margin-top:.3rem}
iframe.sim{width:100%;height:26rem;border:1px solid var(--line);border-radius:12px;margin:.5rem 0;background:#fff}
.isim{background:#fff;border:1px solid var(--line);border-radius:12px}
.badges{display:flex;flex-wrap:wrap;gap:.4rem}
.badge{background:var(--mint);border:1px solid #BFD8D2;border-radius:999px;padding:.2rem .7rem;font-size:.85rem;color:var(--navy)}
.badge b{font-size:1rem}
.brow{display:flex;align-items:center;gap:.5rem;margin:.35rem 0;font-size:.86rem}
.brow .nm{min-width:8.5rem;color:#40506a}
.bar{flex:1;height:.55rem;background:#E7EDF5;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.bar i.g{background:#48A96B}
.radar{background:#fff;border-radius:12px}
.mt{font-weight:700;color:var(--navy);font-size:.85rem;margin-bottom:.2rem}
@media print{.steps,.ohead{display:none}}

/* ===== الوضع الليلي ===== */
body.dark{--navy:#7FA9E8;--blue:#8FB6EE;--mint:#16283F;--gold:#2E2919;--line:#243348;--ink:#DCE6F5;--bg:#0E1726}
body.dark #bar{background:#0B1220}
body.dark .card,body.dark .card2,body.dark table,body.dark .gate,body.dark .ohead,body.dark .uhead2,body.dark .st,body.dark .opt,body.dark textarea,body.dark .fl select,body.dark .fl input,body.dark .search,body.dark .stat,body.dark .fig,body.dark .radar,body.dark .eq,body.dark .isim,body.dark .fcard{background:#16202F;color:var(--ink);border-color:var(--line)}
body.dark th{background:#1E3A5F;color:#EAF2FF}
body.dark tr:nth-child(even) td{background:#1A2536}
body.dark .box{border-color:var(--line)}
body.dark .box.mint{background:#16283F}
body.dark .box.gold{background:#2E2919;border-color:#4A3F22}
body.dark .steps,body.dark .tabs{background:var(--bg)}
body.dark .st.on,body.dark .tab.on{background:#1E3A5F;color:#fff;border-color:#2C5488}
body.dark h1.ch{background:#1E3A5F}
body.dark .opt.right{background:#16341F;border-color:#2F7A4A}
body.dark .opt.wrong{background:#3A1A1A;border-color:#8B3A3A}
body.dark .fb.g{background:#16341F;color:#8FE3AC}body.dark .fb.r{background:#3A1A1A;color:#F0A9A9}
body.dark .btn.ghost{background:#16202F}
body.dark .bar{background:#22304A}
body.dark .mine{background:#141D2B}
body.dark .json{background:#05090F}
body.dark .hint,body.dark .card .meta,body.dark .uhead2 span{color:#9FB2CC}
/* ===== بطاقات المصطلحات ===== */
.flash{margin:.5rem 0}
.fcard{background:#fff;border:1px solid var(--line);border-radius:14px;min-height:7.5rem;display:grid;place-items:center;text-align:center;padding:1rem;cursor:pointer;transition:.15s}
.fcard:hover{border-color:var(--blue)}
.fcard .ff{font-size:1.25rem;font-weight:700;color:var(--navy)}
.fcard .fb2{font-size:1rem;color:var(--ink);line-height:1.9}
.fcard.back{background:var(--mint)}
.nash{margin-top:.5rem}
/* ===== شهادة الإتمام ===== */
#certbox{display:none}
.cert{border:6px double var(--navy);border-radius:14px;padding:2rem 1.5rem;text-align:center;background:#fff;color:#12243B;max-width:26cm;margin:0 auto}
.cert .clogo{width:90px;height:90px;object-fit:contain}
.cert .c1{font-size:1rem;color:#40506a}
.cert .c2{font-size:1.1rem;font-weight:700;color:#00205B}
.cert .ctitle{font-size:2rem;font-weight:700;color:#2B5CA8;margin:1.2rem 0 .8rem;letter-spacing:.04em}
.cert .c3{font-size:1.05rem;margin:.5rem 0}
.cert .cname{font-size:1.7rem;font-weight:700;color:#00205B;margin:.4rem 0}
.cert .cunit{font-size:1.4rem;font-weight:700;color:#7A2E2E;margin:.4rem 0}
.cert .csign{display:flex;justify-content:space-between;margin-top:2.5rem;font-size:.95rem;color:#40506a}
@media print{
  body.pcert #app,body.pcert #bar,body.pcert #flash{display:none!important}
  body.pcert #certbox{display:block}
}
@media print{#bar,.tabs,.btn,.btns2,textarea{display:none}.ans,.sol{display:block!important}}
.simbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.9rem;margin:.8rem 0}
.simbox .srow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;margin:.6rem 0}
.simbox .sf{display:flex;flex-direction:column;gap:.2rem;font-size:.82rem;color:#5b6b80}
.simbox .sf select,.simbox .sf input[type=range]{font:inherit;font-size:.9rem;padding:.3rem .4rem;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:9rem}
.simbox .nv{color:var(--navy);font-size:1rem}
.simbox .sb{background:#fff;border:1px solid var(--navy);color:var(--navy);border-radius:10px;padding:.45rem .8rem;font:inherit;font-size:.88rem;cursor:pointer}
.simbox .sb.go{background:var(--navy);color:#fff}
.simbox .sb.gh{border-color:var(--line);color:#5b6b80}
.simbox .shint{font-size:.84rem;color:#5b6b80;margin:.3rem 0}
.simbox .sres{margin-top:.7rem;border-top:1px dashed var(--line);padding-top:.6rem}
.simbox .sl{font-size:.92rem;margin:.25rem 0}
.simbox .sl.ok{color:#14603f}
.simbox .sl.note{color:#7a5407;background:#FFF4DC;border-radius:9px;padding:.4rem .6rem;margin-top:.5rem}
/* مربع بانيت */
.pq{display:grid;grid-template-columns:2.2rem 1fr 1fr;gap:.35rem;max-width:22rem;margin:.5rem auto}
.pq .ph{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);min-height:2.2rem}
.pq .pc{border:2px solid var(--line);border-radius:10px;min-height:3.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafbfd}
.pq .pc b{font-size:1.15rem}
.pq .pc i{font-style:normal;font-size:.78rem;color:#40506a;margin-top:.1rem}
.pq .qm{color:#c3ccd8;font-size:1.3rem}
/* DNA */
.dna{margin:.6rem 0;overflow-x:auto}
.drow{display:flex;gap:.3rem;justify-content:center;min-width:max-content}
.drow.bonds{height:1.1rem}

/* ===== طبقة التحقّق من التعلّم ===== */
.lrn .lrhead{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:16px;padding:1rem 1.1rem;margin-bottom:.9rem}

.lrn .lrhead.ok{background:linear-gradient(135deg,#14603f,#1C7C54)}

.lrn .lrhead.bad{background:linear-gradient(135deg,#8e1f19,#B3261E)}
.lrn .lrhead strong{display:block;font-size:1.35rem}

.lrn .lbar{height:8px;border-radius:99px;background:#ffffff33;overflow:hidden;display:flex;margin:.5rem 0}

.lrn .lbar i{display:block;height:100%;background:#9BE3C0}

.lrn .lbar i.m{background:#E3B457}
.lrn .lsec{color:var(--navy);font-size:1rem;margin:1.2rem 0 .5rem;border-inline-start:5px solid var(--blue);padding-inline-start:.6rem}
.lrn .lentry{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));margin-bottom:.9rem}
.lrn .lentry button{text-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.9rem;cursor:pointer;font:inherit;color:inherit}

.lrn .lentry b{display:block;color:var(--navy);font-size:1.02rem;margin-bottom:.15rem}
.lrn .lentry i{font-style:normal;font-size:.82rem;color:#5b6b80;display:block}
.lrn .lentry em{font-style:normal;display:inline-block;margin-top:.5rem;font-size:.75rem;border-radius:999px;padding:.1rem .55rem}
.lrn .lentry em.gate{background:#E8F5EE;color:#1C7C54}
.lrn .lentry em.nogate{background:#F0F3F7;color:#56657a}
.lrn .lchips{display:flex;flex-wrap:wrap;gap:.35rem}
.lrn .lchip{font-size:.78rem;border-radius:999px;padding:.15rem .6rem;border:1px solid transparent;white-space:nowrap}
.lrn .lchip.no{background:#F0F3F7;color:#56657a;border-color:#dfe5ec}
.lrn .lchip.mid{background:#FFF4DC;color:#B07A12;border-color:#f0dcb0}
.lrn .lchip.ok{background:#E8F5EE;color:#1C7C54;border-color:#b8ddc8}
.lrn .lrow{display:flex;gap:.6rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.75rem;margin-bottom:.5rem;cursor:pointer}
.lrn .lrow:hover{border-color:var(--blue)}
.lrn .lrow.off{opacity:.55;cursor:default}
.lrn .lrow .num{flex:0 0 2rem;text-align:center;font-weight:700;color:var(--navy)}
.lrn .lrow>div:not(.num){flex:1}
.lrn .lrow strong{display:block;color:var(--navy);font-size:1rem}
.lrn .lrow span:not(.lchip){display:block;font-size:.8rem;color:#5b6b80}
.lrn .lt{display:block;color:var(--navy);font-size:1.15rem;margin-top:.2rem}
.lrn .lsum{background:var(--gold);border:1px solid #f0e2bd;border-radius:12px;padding:.8rem;font-size:.95rem}
.lrn .lsum p{margin:.35rem 0}
.lrn .lfig{background:var(--mint);border:1px dashed #9fc4ba;border-radius:12px;padding:1rem .8rem;text-align:center;color:#2b6b5c;font-size:.86rem;margin:.7rem 0}
/* ===== أشكال الكتاب ===== */
.figs{margin:.8rem 0;display:grid;gap:.6rem}
.figs.multi{grid-template-columns:1fr 1fr}
@media (max-width:520px){.figs.multi{grid-template-columns:1fr}}
.figc{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:.5rem;cursor:zoom-in;overflow:hidden}

.figsep{margin:1.4rem 0 .2rem;padding:.55rem .8rem;background:#FFFCF4;border:1px solid #e8dcc0;border-radius:10px;font-size:.84rem;color:#7a6534;font-weight:700}

.figmiss{height:6.6rem;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#9aa7a1;background:#f6f6f4;border-radius:7px}

.figt{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.35rem;cursor:zoom-in;overflow:hidden}
.figt.act{border-color:#e0cba0;background:#FFFCF4}
.figt img{display:block;width:100%;height:6.6rem;object-fit:contain;background:#f6f6f4;border-radius:7px}
.figt figcaption{font-size:.72rem;color:#44544f;padding:.3rem .2rem 0;line-height:1.5;display:block}
.figt figcaption span{display:block;font-size:.66rem;color:#8a978f;margin-top:.15rem}

.figov{position:fixed;inset:0;background:rgba(18,28,25,.88);z-index:9000;display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto}

.figmeta{padding:.6rem .4rem .2rem;font-size:.86rem;line-height:1.75;color:#33443e}
.figmeta b{display:block;color:#1f3b33;margin-bottom:.25rem}
.figmeta p{margin:0;color:#56655f;font-size:.82rem}
.figx{position:absolute;inset-inline-end:.45rem;inset-block-start:.45rem;z-index:2;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:50%;width:2rem;height:2rem;font-size:1rem;line-height:1;cursor:pointer}
.lrn .lwarn{background:#FFF4DC;border:1px solid #f0dcb0;border-inline-start:5px solid #E3B457;border-radius:12px;padding:.7rem .85rem;margin:.8rem 0;font-size:.92rem}
.lrn .lthread{display:grid;gap:.6rem;margin:.9rem 0}
.lrn .lthread>div{border-radius:12px;padding:.75rem .85rem;font-size:.9rem}
.lrn .lthread .th1{background:#F1F4F9;border:1px solid var(--line)}
.lrn .lthread .th2{background:#EEF6F3;border:1px solid #bfdcd2}
.lrn .lthread b{display:block;color:var(--navy);font-size:.88rem;margin-bottom:.2rem}
.lrn .lthread p{margin:.25rem 0}
.lrn .lthread .tu{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 .5rem;font-size:.78rem;color:var(--navy)}
.lrn .lq{font-size:1.05rem;font-weight:600;color:var(--navy);margin:.2rem 0 .8rem}
.lrn .lopts{display:grid;gap:.5rem}
.lrn .lopt{display:flex;gap:.25rem;align-items:baseline;text-align:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:.65rem .8rem;font:inherit;color:var(--ink);cursor:pointer}

.lrn .lopt .k{flex:0 0 auto;color:#5b6b80}
.lrn .lopt .v{flex:1}
.lrn .lopt.pick-ok{border-color:#1C7C54;background:#E8F5EE}
.lrn .lopt.pick-bad{border-color:#B3261E;background:#FCEAE8}
.lrn .lopt.show-ok{border-color:#1C7C54;background:#f3faf6}
.lrn .lfb{margin-top:.8rem;border-radius:12px;padding:.7rem .85rem;font-size:.92rem}
.lrn .lfb.good{background:#E8F5EE;border:1px solid #b8ddc8;color:#14603f}
.lrn .lfb.bad{background:#FCEAE8;border:1px solid #efc4c0;color:#8e1f19}
.lrn .lfb p{margin:.3rem 0}
.lrn .lfb .sm{font-size:.85rem}
.lrn .lmeter{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--navy);margin-bottom:.5rem}
.lrn .dot{width:.75rem;height:.75rem;border-radius:99px;background:#dde4ee;display:inline-block}
.lrn .dot.on{background:#1C7C54}
.lrn .lback{display:inline-block;margin-bottom:.6rem;cursor:pointer}
.lrn .ctr{text-align:center}
.lrn .box.bad{background:#FCEAE8;border-color:#efc4c0}
.lrn td.g{background:#E8F5EE;color:#14603f}
.lrn td.y{background:#FFF4DC;color:#7a5407}
.lrn td.r{background:#FCEAE8;color:#8e1f19}
body.dark .lrn .lentry button,body.dark .lrn .lrow,body.dark .lrn .lopt{background:#13243A;color:#E7EEF7}
body.dark .lrn .lsum{background:#2E2919}
body.dark .lrn .lthread .th1{background:#16283F}
body.dark .lrn .lthread .th2{background:#16302A}


.vwrap{overflow-x:auto;margin:.5rem 0}
